name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Xcode ${{ matrix.xcode }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.0.1', '26.6']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test release library and generated API adapter
        run: swift test
      - name: Test OpenAPI maintainer tooling
        run: swift test --package-path Tools/OpenAPIGeneration
      - name: Build release executable
        run: swift build -c release --product apogee
      - name: Check CLI without credentials
        run: bash Tests/Integration/cli-smoke.sh .build/release/apogee
      - name: Build public library consumer
        run: swift run --package-path Examples/ReleaseTools ReleaseToolsExample Examples/ReleaseTools/AppStore/Metadata
      - name: Check consumer command plugin
        run: swift package --package-path Examples/ReleaseTools plugin --allow-network-connections all apogee validate-metadata
      - name: Check tracked changes
        run: |
          git diff --check
          git diff --exit-code
