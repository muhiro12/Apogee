name: Verify

on:
  push:
    branches-ignore: [main, 'dependabot/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versioning without publishing
        run: bash Tests/Integration/release-automation.sh

  package:
    name: Xcode ${{ matrix.xcode }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.0.1', '26.6']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test release library and generated API adapter
        run: swift test -Xswiftc -warnings-as-errors
      - name: Test OpenAPI maintainer tooling
        run: swift test --package-path Tools/OpenAPIGeneration -Xswiftc -warnings-as-errors
      - name: Build release executable
        run: swift build -c release --product apogee -Xswiftc -warnings-as-errors
      - name: Check CLI without credentials
        run: bash Tests/Integration/cli-smoke.sh .build/release/apogee
      - name: Build public library consumer
        run: swift run --package-path Examples/ReleaseTools ReleaseToolsExample Examples/ReleaseTools/AppStore/Metadata
      - name: Check consumer command plugin
        run: swift package --package-path Examples/ReleaseTools plugin --allow-network-connections all apogee validate-metadata
      - name: Check public API classification and DocC
        run: bash Tools/Documentation/build.sh
      - name: Check tracked changes
        run: |
          git diff --check
          git diff --exit-code
